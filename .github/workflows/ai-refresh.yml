# AI full audit (the smart half of the hybrid refresh): verify every deal,
# prune dead ones, hunt new deals, manage "New today", update lastChecked,
# commit, and trigger a redeploy. Runs Mon/Wed/Fri at 10:00 UTC (~5 AM Central,
# 4 AM in winter — accepted drift), and on demand via workflow_dispatch.
#
# Auth: set ONE of these repo secrets —
#   ANTHROPIC_API_KEY          (Anthropic Console, pay per use)
#   CLAUDE_CODE_OAUTH_TOKEN    (Claude Pro/Max subscription; run
#                               `claude setup-token` locally to mint one)
name: AI deal refresh

on:
  schedule:
    - cron: "0 10 * * 1,3,5"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ai-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Claude Code audit
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 250 --allowedTools Bash,Read,Edit,Write,Glob,Grep,WebFetch,WebSearch"
          prompt: |
            Audit and refresh Jude's Craft Deals. The catalog lives entirely in
            src/data/deals.ts; read README.md's "Data rules" section first.

            1. VERIFY every listed deal against its exact live retailer product
               page (fetch the URL; for Hobbii append .js for JSON; retailers
               that block you from this runner get best-effort checks via
               web search or cached pages — note anything you could not verify).
               Remove any deal that is unavailable, no longer discounted, links
               incorrectly, has a mismatched photo/title/variant, or has a stale
               price. Correct drifted prices. Update each verified deal's
               `verified` date (America/Chicago calendar day).
            2. FIND and add new crochet, yarn, beading, stringing, beading-tool,
               crochet-tool, and craft-machine deals (yarn ball winders, swifts,
               electric bead spinners and similar under "Craft machines") from
               Walmart, Michaels, Hobby Lobby, Hobbii, and other reputable
               retailers. Only add a deal you are at least ~75% confident in
               after checking the direct product URL, product identity, current
               price, comparison price, and genuine discount. Use "Beading" (not
               "Beads") as the craft label; "Stringing" stays its own kind.
               New deals get the next unused id, `fresh:true`, today's
               `verified` date, and a `saleType` when determinable. Never add a
               product URL that already exists (npm run validate-deals guards
               this). Do not claim local inventory unless confirmed.
            3. IMAGES: for every new deal, run
               `node scripts/download-images.mjs --rewrite` so its photo is
               self-hosted in public/products/; remove image files of deals you
               deleted.
            4. NEW TODAY: clear `fresh:true` from deals not added today
               (America/Chicago). The catalog should grow or change when
               qualifying deals exist; do not merely rotate old cards.
            5. GARAGE SALES: check Edmond/OKC garage- and estate-sale listings
               (garagesalefinder.com, estatesales.net) and update the garage
               sale section in src/App.tsx so it only shows active or upcoming
               sales that explicitly mention crafting supplies.
            6. Update meta.lastChecked in src/data/deals.ts to now in
               America/Chicago, formatted like "July 20, 2026 at 5:00 AM
               Central".
            7. Run `npm run build`; fix anything it flags. Accuracy is
               paramount, but strong evidence at the ~75% threshold is enough —
               absolute certainty is not required.
            8. Commit all changes to main with a summary of what was verified,
               removed, corrected, and added (author: github-actions bot), and
               push. If nothing changed, commit nothing.
      - name: Trigger deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # pushes made with GITHUB_TOKEN don't fire push-triggered workflows,
          # so kick the Pages deploy explicitly (skips cleanly if no new commit)
          gh workflow run deploy.yml --ref main
